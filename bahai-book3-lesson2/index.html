<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Justice — Book 3, Lesson 2 | Teacher Screen</title>
<style>
  :root{
    --bg: #FBF3E7;
    --panel: #FFFDF8;
    --panel-2: #F4EBD9;
    --ink: #2B2118;
    --muted: #7C6E5A;
    --border: #E4D7BE;
    --accent: #2F6F6E;
    --accent-dark: #204B4A;
    --accent-tint: #DCEEEC;
    --gold: #B87F2B;
    --gold-tint: #F2E0BC;
    --good: #3F7D53;
    --good-tint: #DEEEE0;
    --warn: #C24A30;
    --warn-tint: #F6DDD3;
    --board-bg: #26312F;
    --board-ink: #F2EFE6;
    --board-chalk: #E8C468;
    --radius: 14px;
    --font-display: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #191510;
      --panel: #221D17;
      --panel-2: #2B2419;
      --ink: #F1E9DC;
      --muted: #B3A38C;
      --border: #3C3325;
      --accent: #55ACA9;
      --accent-dark: #3A8A87;
      --accent-tint: #223938;
      --gold: #E3B563;
      --gold-tint: #3B3020;
      --good: #6FBE85;
      --good-tint: #223A29;
      --warn: #E58A6C;
      --warn-tint: #3E241C;
      --board-bg: #101917;
      --board-ink: #F2EFE6;
      --board-chalk: #E8C468;
    }
  }
  :root[data-theme="dark"]{
    --bg: #191510;
    --panel: #221D17;
    --panel-2: #2B2419;
    --ink: #F1E9DC;
    --muted: #B3A38C;
    --border: #3C3325;
    --accent: #55ACA9;
    --accent-dark: #3A8A87;
    --accent-tint: #223938;
    --gold: #E3B563;
    --gold-tint: #3B3020;
    --good: #6FBE85;
    --good-tint: #223A29;
    --warn: #E58A6C;
    --warn-tint: #3E241C;
    --board-bg: #101917;
    --board-ink: #F2EFE6;
    --board-chalk: #E8C468;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family: var(--font-body);
  }
  .app{ max-width: 1180px; margin: 0 auto; padding: 18px 18px 60px; }

  header.top{
    display:flex; flex-wrap:wrap; gap:14px; align-items:center; justify-content:space-between;
    background: var(--panel);
    border:1px solid var(--border); border-radius: var(--radius);
    padding: 18px 22px; margin-bottom: 16px;
    border-top: 3px solid var(--accent);
  }
  header.top h1{ margin:0; font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; letter-spacing: 0.01em; text-wrap: balance; }
  header.top .sub{ margin:3px 0 0; color:var(--muted); font-size: 0.9rem; }
  .badges{ display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
  .badge{
    background:var(--panel-2); border:1px solid var(--border); border-radius: 999px;
    padding: 5px 12px; font-size: 0.76rem; color:var(--muted); letter-spacing:0.02em;
  }

  .top-controls{ display:flex; flex-direction:column; gap:10px; align-items:flex-end; }
  .master-timer{
    display:flex; align-items:center; gap:12px; background:var(--panel-2);
    border:1px solid var(--border); border-radius: var(--radius); padding: 8px 14px;
  }
  .master-timer .clock{
    font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 1.6rem; font-weight:600; min-width: 82px; text-align:center;
  }
  .master-timer.low .clock{ color: var(--warn); }
  .btn{
    border:none; border-radius: 10px; padding: 8px 14px; font-size: 0.9rem; cursor:pointer;
    background: var(--accent); color:#fff; font-weight:600; font-family: var(--font-body);
  }
  .btn:hover{ background: var(--accent-dark); }
  .btn:focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }
  .btn.secondary{ background:transparent; color: var(--accent-dark); border:1px solid var(--accent); }
  .btn.secondary:hover{ background: var(--accent-tint); }
  .btn.gold{ background: var(--gold); }
  .btn.gold:hover{ background: var(--accent-dark); }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; }
  .btn.small{ padding:5px 10px; font-size:0.8rem; }

  .kid-screen-control{ display:flex; align-items:center; gap:8px; }
  .kid-status{ font-size:0.78rem; color:var(--muted); }
  .kid-status.open{ color: var(--good); font-weight:600; }
  .kid-status.blocked{ color: var(--warn); font-weight:600; }

  .layout{ display:grid; grid-template-columns: 250px 1fr; gap:16px; }
  @media (max-width: 860px){ .layout{ grid-template-columns: 1fr; } }

  nav.steps{ display:flex; flex-direction:column; gap:8px; }
  .step-btn{
    display:flex; flex-direction:column; align-items:flex-start; gap:2px;
    text-align:left; background:var(--panel); border:1px solid var(--border);
    border-radius: 12px; padding: 10px 12px; cursor:pointer; color:var(--ink);
    font-family: var(--font-body);
  }
  .step-btn:focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }
  .step-btn .t{ font-weight:700; font-size:0.92rem; }
  .step-btn .m{ font-size:0.78rem; color:var(--muted); font-variant-numeric: tabular-nums; }
  .step-btn.active{ background: var(--accent); color:#fff; border-color: var(--accent-dark); }
  .step-btn.active .m{ color: #fff9ee; }
  .step-btn.done{ border-color: var(--good); }
  .step-btn.done:not(.active) .t::before{ content:"✓ "; color: var(--good); }

  .prep{
    margin-top: 14px; background:var(--panel); border:1px solid var(--border);
    border-radius: 12px; padding: 12px 14px;
  }
  .prep h3{ margin:0 0 8px; font-size:0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color:var(--muted); }
  .prep label{ display:flex; gap:8px; align-items:flex-start; font-size:0.85rem; margin-bottom:6px; color:var(--muted); cursor:pointer; }
  .prep input[type=checkbox]{ margin-top:2px; accent-color: var(--accent); }
  .prep label.checked{ color: var(--ink); text-decoration: line-through; text-decoration-color: var(--good); }

  main.panel{
    background:var(--panel); border:1px solid var(--border); border-radius: var(--radius);
    padding: 24px 28px; min-height: 420px;
  }
  main.panel h2{ margin-top:0; font-family: var(--font-display); font-size:1.4rem; text-wrap: balance; }
  .step-meta{ display:flex; gap:10px; align-items:center; color:var(--muted); font-size:0.85rem; margin-bottom: 16px; flex-wrap:wrap; }

  .step-timer{ display:flex; align-items:center; gap:8px; background: var(--accent-tint); border-radius: 999px; padding: 4px 6px 4px 14px; }
  .step-timer .clock{ font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight:600; min-width:58px; }
  .step-timer.low{ background: var(--warn-tint); }
  .step-timer.low .clock{ color: var(--warn); }

  .quote-card{
    background: var(--board-bg); border-radius: 12px;
    padding: 18px 16px; text-align:center; margin: 14px 0;
    box-shadow: inset 0 0 0 5px #00000022, 0 1px 0 var(--border);
  }
  .quote-words{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; font-family: var(--font-display); font-style: italic; font-size:1.15rem; font-weight:600; line-height:1.6; color: var(--board-ink); }
  .word{ padding: 2px 4px; border-bottom: 3px solid transparent; cursor:pointer; border-radius:6px; }
  .word:hover{ background: rgba(255,255,255,0.08); }
  .word.hidden{ color: transparent; border-bottom-color: var(--board-chalk); user-select:none; }
  .quote-attr{ margin-top: 10px; color: var(--board-ink); opacity: 0.65; font-style: italic; font-family: var(--font-display); font-size:0.85rem; }

  .prayer{
    background:var(--gold-tint); border-left:4px solid var(--gold); border-radius: 8px;
    padding: 18px 22px; font-size:1.1rem; line-height:1.6; font-style: italic; font-family: var(--font-display);
  }
  .prayer .who{ display:block; margin-top:8px; font-style:normal; color:var(--muted); font-size:0.85rem; font-family: var(--font-body); }

  ul.tidy{ padding-left: 20px; line-height:1.75; }
  .qbox{ background:var(--panel-2); border-radius:10px; padding:14px 18px; margin: 12px 0; }
  .qbox h4{ margin:0 0 6px; font-size:0.76rem; text-transform: uppercase; letter-spacing: 0.05em; color:var(--accent-dark); }

  .story{ background:var(--panel-2); border-radius:10px; padding:16px 20px; line-height:1.75; }

  .control-card{ background:var(--panel-2); border-radius:12px; padding:16px 18px; margin-top:14px; }
  .control-card h4{ margin:0 0 10px; font-size:0.76rem; text-transform: uppercase; letter-spacing: 0.05em; color:var(--accent-dark); }
  .control-row{ display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin-bottom:12px; }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field label{ font-size:0.78rem; color:var(--muted); }
  .field input{ width:88px; padding:8px 10px; border-radius:8px; border:1px solid var(--border); font-size:1rem; font-family: var(--font-mono); background: var(--panel); color: var(--ink); }
  .btn-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .status-line{ margin-top:10px; padding:10px 14px; border-radius:10px; background:var(--panel); border:1px solid var(--border); font-size:0.9rem; }
  .status-line.fair{ border-color: var(--good); background: var(--good-tint); }
  .status-line.uneven{ border-color: var(--warn); background: var(--warn-tint); }

  .drawing-prompts{ display:flex; flex-wrap:wrap; gap:10px; margin-top: 10px; }
  .prompt-chip{ background: var(--accent-tint); color: var(--accent-dark); border-radius: 999px; padding:8px 14px; font-size:0.9rem; font-weight: 600; }

  textarea.note{
    width:100%; min-height: 60px; border:1px solid var(--border); border-radius:8px;
    padding:8px 10px; font-family: inherit; font-size:0.85rem; resize: vertical;
    background: var(--panel-2); color: var(--ink);
  }
  .notes-grid{ display:grid; gap:10px; margin-top:8px; }
  .notes-grid label{ font-size:0.75rem; color:var(--muted); font-weight:600; text-transform: uppercase; letter-spacing: 0.04em; }

  .footer-nav{ display:flex; justify-content:space-between; margin-top:24px; }

  .sound-toggle{ display:flex; align-items:center; gap:6px; font-size:0.78rem; color:var(--muted); }
  .sound-toggle input{ accent-color: var(--accent); }

  @media (prefers-reduced-motion: reduce){ *{ transition: none !important; } }
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div>
      <h1>Justice — Tread the Path</h1>
      <p class="sub">Teacher Screen · Book 3, Lesson 2</p>
      <div class="badges">
        <span class="badge">Ages 5–7</span>
        <span class="badge">Up to 8 children</span>
        <span class="badge">45 minutes</span>
      </div>
    </div>
    <div class="top-controls">
      <div class="master-timer" id="masterTimerBox">
        <div class="clock" id="masterClock">45:00</div>
        <button class="btn" id="masterStart">Start Class</button>
        <button class="btn secondary" id="masterReset">Reset</button>
        <label class="sound-toggle"><input type="checkbox" id="soundToggle" checked> Chime</label>
      </div>
      <div class="kid-screen-control">
        <button class="btn gold" id="kidScreenBtn">🖥️ Open Kid Screen</button>
        <span class="kid-status" id="kidStatus">Not open — click to show it on the class screen</span>
      </div>
    </div>
  </header>

  <div class="layout">
    <div>
      <nav class="steps" id="stepNav"></nav>
      <div class="prep">
        <h3>Teacher prep checklist</h3>
        <div id="prepList"></div>
      </div>
    </div>

    <main class="panel" id="panel"></main>
  </div>
</div>

<script>
const PRAYER = {
  text: "O God, guide me, protect me, make of me a shining lamp and a brilliant star. Thou art the Mighty and the Powerful.",
  who: "— 'Abdu'l-Bahá"
};
const QUOTE_TEXT = "Tread ye the path of justice, for this, verily, is the straight path.";
const QUOTE_WHO = "— Bahá'u'lláh";

const PREP_ITEMS = [
  "Whiteboard, working marker and eraser",
  "Quote written up before class starts",
  "Counters or pasta and a basket for the game",
  "Paper and colouring pencils for the drawing",
  "The prayer printed or written where you can see it"
];

const AVATAR_COLORS = ['#E4572E','#F3A712','#4C9F70','#3A86FF','#8338EC','#FF5D8F','#2EC4B6','#B5852E'];

const steps = [
  { id:1, title:"Welcome & Opening Prayer", minutes:5, emoji:"🙏", kidLabel:"Welcome" },
  { id:2, title:"The Quote & Whiteboard", minutes:12, emoji:"⭐", kidLabel:"The Quote" },
  { id:3, title:"Talk & Story", minutes:8, emoji:"🍊", kidLabel:"Our Story" },
  { id:4, title:"The Game: Fair Shares", minutes:10, emoji:"🧺", kidLabel:"Fair Shares" },
  { id:5, title:"Drawing", minutes:8, emoji:"🎨", kidLabel:"Drawing" },
  { id:6, title:"Review & Closing Prayer", minutes:2, emoji:"🎉", kidLabel:"All Done!" }
];

let current = 1;
let stepTimers = {};
steps.forEach(s => stepTimers[s.id] = { remaining: s.minutes*60, running:false, interval:null, everRan:false });
let masterRemaining = 45*60;
let masterRunning = false;
let masterInterval = null;
let kidWin = null;

function fmt(sec){
  sec = Math.max(0, sec);
  const m = Math.floor(sec/60);
  const s = sec%60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function playChime(){
  if(!document.getElementById('soundToggle').checked) return;
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [660, 880].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + i*0.18 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i*0.18 + 0.35);
      osc.connect(gain).connect(ctx.destination);
      osc.start(ctx.currentTime + i*0.18);
      osc.stop(ctx.currentTime + i*0.18 + 0.4);
    });
  }catch(e){}
}

function updateMasterClock(){
  const clock = document.getElementById('masterClock');
  clock.textContent = fmt(masterRemaining);
  document.getElementById('masterTimerBox').classList.toggle('low', masterRemaining <= 120 && masterRemaining > 0);
}

document.getElementById('masterStart').addEventListener('click', () => {
  masterRunning = !masterRunning;
  const btn = document.getElementById('masterStart');
  if(masterRunning){
    btn.textContent = 'Pause';
    masterInterval = setInterval(() => {
      if(masterRemaining > 0){
        masterRemaining--;
        updateMasterClock();
        if(masterRemaining === 0) playChime();
      }
    }, 1000);
  } else {
    btn.textContent = 'Start Class';
    clearInterval(masterInterval);
  }
});
document.getElementById('masterReset').addEventListener('click', () => {
  masterRemaining = 45*60;
  masterRunning = false;
  clearInterval(masterInterval);
  document.getElementById('masterStart').textContent = 'Start Class';
  updateMasterClock();
});

function renderPrep(){
  const box = document.getElementById('prepList');
  box.innerHTML = '';
  PREP_ITEMS.forEach((item, idx) => {
    const key = 'prep_' + idx;
    const checked = localStorage.getItem(key) === '1';
    const label = document.createElement('label');
    label.className = checked ? 'checked' : '';
    label.innerHTML = `<input type="checkbox" ${checked ? 'checked' : ''}> <span>${item}</span>`;
    label.querySelector('input').addEventListener('change', (e) => {
      localStorage.setItem(key, e.target.checked ? '1' : '0');
      label.classList.toggle('checked', e.target.checked);
    });
    box.appendChild(label);
  });
}

function renderNav(){
  const nav = document.getElementById('stepNav');
  nav.innerHTML = '';
  steps.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'step-btn' + (s.id === current ? ' active' : '') + (stepTimers[s.id].everRan && stepTimers[s.id].remaining === 0 ? ' done' : '');
    btn.innerHTML = `<span class="t">${s.emoji} ${s.id}. ${s.title}</span><span class="m">${s.minutes} min</span>`;
    btn.addEventListener('click', () => { current = s.id; render(); });
    nav.appendChild(btn);
  });
}

function stepTimerControls(stepId){
  const t = stepTimers[stepId];
  const wrap = document.createElement('div');
  wrap.className = 'step-timer' + (t.remaining <= 60 && t.remaining > 0 ? ' low' : '');
  wrap.innerHTML = `<span class="clock">${fmt(t.remaining)}</span>`;
  const startBtn = document.createElement('button');
  startBtn.className = 'btn small';
  startBtn.textContent = t.running ? 'Pause' : (t.everRan ? 'Resume' : 'Start');
  startBtn.addEventListener('click', () => toggleStepTimer(stepId));
  const resetBtn = document.createElement('button');
  resetBtn.className = 'btn secondary small';
  resetBtn.textContent = 'Reset';
  resetBtn.addEventListener('click', () => resetStepTimer(stepId));
  wrap.appendChild(startBtn);
  wrap.appendChild(resetBtn);
  return wrap;
}

function toggleStepTimer(stepId){
  const t = stepTimers[stepId];
  t.running = !t.running;
  t.everRan = true;
  if(t.running){
    t.interval = setInterval(() => {
      if(t.remaining > 0){
        t.remaining--;
        if(t.remaining === 0){
          playChime();
          t.running = false;
          clearInterval(t.interval);
        }
        if(current === stepId) refreshStepTimerUI(stepId);
        if(stepId === 5) updateKidTimerOnly();
      }
    }, 1000);
  } else {
    clearInterval(t.interval);
  }
  if(current === stepId) render();
}

function resetStepTimer(stepId){
  const t = stepTimers[stepId];
  clearInterval(t.interval);
  t.remaining = steps.find(s => s.id === stepId).minutes * 60;
  t.running = false;
  if(current === stepId) render();
  renderNav();
  if(stepId === 5) updateKidScreen();
}

function refreshStepTimerUI(stepId){
  const el = document.querySelector('.step-timer .clock');
  if(el) el.textContent = fmt(stepTimers[stepId].remaining);
  const box = document.querySelector('.step-timer');
  if(box) box.classList.toggle('low', stepTimers[stepId].remaining <= 60 && stepTimers[stepId].remaining > 0);
  if(stepTimers[stepId].remaining === 0) renderNav();
}

let quoteWords = [];
let hideOrder = [];
let hiddenCount = 0;

function setupQuote(){
  quoteWords = QUOTE_TEXT.split(' ');
  hideOrder = quoteWords.map((_, i) => i);
  for(let i = hideOrder.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [hideOrder[i], hideOrder[j]] = [hideOrder[j], hideOrder[i]];
  }
  hiddenCount = 0;
}
setupQuote();

function renderQuoteStep(){
  const box = document.createElement('div');
  box.innerHTML = `
    <div class="qbox">
      <h4>What it means (say it simply)</h4>
      Being fair is like walking on a straight path. When we are fair to everyone, we stay on the right road.
    </div>
    <div class="quote-card">
      <div class="quote-words" id="quoteWords"></div>
      <div class="quote-attr">${QUOTE_WHO}</div>
    </div>
    <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:14px;">
      <button class="btn" id="hideWordBtn">Hide a Word</button>
      <button class="btn secondary" id="revealAllBtn">Reveal All &amp; Reshuffle</button>
      <span id="quoteStatus" style="align-self:center; color:var(--muted); font-size:0.85rem;"></span>
    </div>
    <div class="qbox">
      <h4>How to run it</h4>
      <ol style="margin:0; padding-left:20px; line-height:1.7;">
        <li>Read the whole quote aloud together two or three times, pointing to each word.</li>
        <li>Click "Hide a Word" — the same word disappears on the big kid screen too.</li>
        <li>Read the whole quote again; children say the missing word from memory.</li>
        <li>Keep hiding one word each round until the board is blank.</li>
        <li>Finish with everyone saying it together, proud and loud.</li>
      </ol>
      <p style="margin:8px 0 0; color:var(--muted); font-size:0.85rem;">Tip: click any word directly to hide or reveal just that one. If they get stuck, reveal it for one round, then try again.</p>
    </div>
  `;
  const wordsEl = box.querySelector('#quoteWords');
  renderQuoteWords(wordsEl);
  box.querySelector('#hideWordBtn').addEventListener('click', () => {
    if(hiddenCount < hideOrder.length){
      hiddenCount++;
      renderQuoteWords(wordsEl);
      updateKidScreen();
    }
  });
  box.querySelector('#revealAllBtn').addEventListener('click', () => {
    setupQuote();
    renderQuoteWords(wordsEl);
    updateKidScreen();
  });
  return box;
}

function renderQuoteWords(container){
  const hiddenIdx = new Set(hideOrder.slice(0, hiddenCount));
  container.innerHTML = '';
  quoteWords.forEach((word, i) => {
    const span = document.createElement('span');
    span.className = 'word' + (hiddenIdx.has(i) ? ' hidden' : '');
    span.textContent = word;
    span.title = 'Click to toggle';
    span.addEventListener('click', () => {
      if(hiddenIdx.has(i)){
        hiddenIdx.delete(i);
      } else {
        hiddenIdx.add(i);
      }
      hideOrder = [...hiddenIdx, ...hideOrder.filter(x => !hiddenIdx.has(x))];
      hiddenCount = hiddenIdx.size;
      renderQuoteWords(container);
      updateKidScreen();
    });
    container.appendChild(span);
  });
  const status = document.getElementById('quoteStatus');
  if(status){
    status.textContent = hiddenCount === 0
      ? 'All words showing'
      : hiddenCount === quoteWords.length
        ? 'All hidden — say it from memory!'
        : `${hiddenCount} of ${quoteWords.length} words hidden`;
  }
}

let storyRevealed = false;

function renderStoryStep(){
  const box = document.createElement('div');
  box.innerHTML = `
    <ul class="tidy">
      <li>Justice means being <strong>fair</strong>.</li>
      <li>It means everyone gets what they need and no one is left out.</li>
      <li>It means we <strong>share</strong> and we <strong>respect</strong> what belongs to other people.</li>
    </ul>
    <div class="qbox">
      <h4>Ask them</h4>
      <ul class="tidy" style="margin:0;">
        <li>What does it feel like when something is not fair?</li>
        <li>Can you tell me about a time you shared, or made something fair?</li>
      </ul>
    </div>
    <div class="story">
      <strong>The story:</strong> Imagine two friends with one orange. One friend grabs the whole orange for himself. Is that fair? What could they do instead? Guide them to see that sharing it, half each, is the fair and just thing to do. That is walking on the straight path.
    </div>
    <div class="control-card">
      <h4>Kid screen picture</h4>
      <div class="btn-row">
        <button class="btn secondary" id="storyUnfairBtn">😢 Show: one friend grabs it all</button>
        <button class="btn" id="storyFairBtn">😊 Show: shared fairly, half each</button>
      </div>
    </div>
  `;
  box.querySelector('#storyUnfairBtn').addEventListener('click', () => { storyRevealed = false; updateKidScreen(); });
  box.querySelector('#storyFairBtn').addEventListener('click', () => { storyRevealed = true; updateKidScreen(); });
  return box;
}

let deal = { children: 8, items: 16, each: 0, leftover: 0, order: [], assigned: [], dealt: 0, total: 0, autoInterval: null };

function computeDealPlan(children, items){
  const each = Math.floor(items / children);
  const leftover = items - each * children;
  const order = [];
  for(let round = 0; round < each; round++){
    for(let c = 0; c < children; c++) order.push(c);
  }
  return { each, leftover, order, total: order.length };
}

function setupDeal(){
  const children = Math.max(1, Math.min(30, parseInt(document.getElementById('numChildren').value, 10) || 1));
  const items = Math.max(0, Math.min(200, parseInt(document.getElementById('numItems').value, 10) || 0));
  clearInterval(deal.autoInterval);
  const plan = computeDealPlan(children, items);
  deal = { children, items, each: plan.each, leftover: plan.leftover, order: plan.order, assigned: new Array(children).fill(0), dealt: 0, total: plan.total, autoInterval: null };
  renderDealStatus();
  updateKidScreen();
}

function dealOne(){
  if(deal.dealt >= deal.total) return false;
  const child = deal.order[deal.dealt];
  deal.assigned[child]++;
  deal.dealt++;
  renderDealStatus();
  updateKidScreen();
  return deal.dealt < deal.total;
}

function dealAllAuto(){
  clearInterval(deal.autoInterval);
  deal.autoInterval = setInterval(() => {
    const more = dealOne();
    if(!more) clearInterval(deal.autoInterval);
  }, 550);
}

function renderDealStatus(){
  const el = document.getElementById('dealStatus');
  if(!el) return;
  if(deal.total === 0 && deal.leftover === 0){
    el.textContent = 'Set the numbers above, then click "Set Up the Pile".';
    el.className = 'status-line';
    return;
  }
  if(deal.dealt < deal.total){
    el.textContent = `Dealt ${deal.dealt} of ${deal.total} — each child will get ${deal.each}.`;
    el.className = 'status-line';
  } else if(deal.leftover === 0){
    el.textContent = `All shared out! Each of the ${deal.children} children has ${deal.each} — perfectly fair, nothing left over.`;
    el.className = 'status-line fair';
  } else {
    el.textContent = `All shared out! Each child has ${deal.each}, with ${deal.leftover} left in the basket. Ask: what should we do with the leftover?`;
    el.className = 'status-line uneven';
  }
}

function renderGameStep(){
  const box = document.createElement('div');
  box.innerHTML = `
    <p><strong>You need:</strong> a small pile of countable items (buttons, counters or dried pasta) and a basket.</p>
    <ol class="tidy">
      <li>Give one child the whole pile and no one else any. Ask the group: "Is this fair?"</li>
      <li>Let them tell you why not.</li>
      <li>Set the numbers below and click "Set Up the Pile", then deal one at a time so the group can watch it become fair.</li>
      <li>When it is shared out, ask: "Now is it fair? How do you know?"</li>
      <li>Play a second round with a number that does not divide evenly, and talk about the leftover.</li>
    </ol>
    <div class="control-card">
      <h4>Set up the sharing game</h4>
      <div class="control-row">
        <div class="field">
          <label for="numChildren">Children</label>
          <input type="number" id="numChildren" min="1" max="30" value="${deal.children}">
        </div>
        <div class="field">
          <label for="numItems">Items</label>
          <input type="number" id="numItems" min="0" max="200" value="${deal.items}">
        </div>
        <button class="btn" id="setupDealBtn">Set Up the Pile 🧺</button>
        <button class="btn secondary" id="unevenBtn">Suggest Uneven Amount</button>
      </div>
      <div class="btn-row">
        <button class="btn" id="dealOneBtn">Deal One ▶</button>
        <button class="btn" id="dealAllBtn">Deal All Fast ⏩</button>
        <button class="btn secondary" id="resetDealBtn">Reset 🔄</button>
      </div>
      <div class="status-line" id="dealStatus"></div>
    </div>
  `;
  box.querySelector('#setupDealBtn').addEventListener('click', setupDeal);
  box.querySelector('#dealOneBtn').addEventListener('click', dealOne);
  box.querySelector('#dealAllBtn').addEventListener('click', dealAllAuto);
  box.querySelector('#resetDealBtn').addEventListener('click', () => {
    document.getElementById('numChildren').value = deal.children;
    document.getElementById('numItems').value = deal.items;
    setupDeal();
  });
  box.querySelector('#unevenBtn').addEventListener('click', () => {
    const children = parseInt(box.querySelector('#numChildren').value, 10) || 8;
    let items;
    do {
      items = Math.floor(Math.random() * 16) + 5;
    } while(children > 0 && items % children === 0);
    box.querySelector('#numItems').value = items;
  });
  setTimeout(renderDealStatus, 0);
  return box;
}

function renderStep(stepId){
  const panel = document.getElementById('panel');
  panel.innerHTML = '';
  const step = steps.find(s => s.id === stepId);
  const heading = document.createElement('h2');
  heading.textContent = `${step.emoji} ${step.id}. ${step.title}`;
  panel.appendChild(heading);

  const meta = document.createElement('div');
  meta.className = 'step-meta';
  meta.innerHTML = `<span>Suggested: ${step.minutes} min</span>`;
  meta.appendChild(stepTimerControls(stepId));
  panel.appendChild(meta);

  let content;
  if(stepId === 1){
    content = document.createElement('div');
    content.innerHTML = `
      <p>Gather the children on the mat, welcome each one by name, and settle them.</p>
      <p>Say this short prayer together, with hands held open. Say it once for them, then have them repeat it after you line by line. We will say the same prayer again at the end.</p>
      <div class="prayer">"${PRAYER.text}"<span class="who">${PRAYER.who}</span></div>
    `;
  } else if(stepId === 2){
    content = renderQuoteStep();
  } else if(stepId === 3){
    content = renderStoryStep();
  } else if(stepId === 4){
    content = renderGameStep();
  } else if(stepId === 5){
    content = document.createElement('div');
    content.innerHTML = `
      <p>Give out paper and pencils. Ask each child to draw <strong>one fair thing they can do</strong>. The kid screen shows big picture cards of the ideas below.</p>
      <div class="drawing-prompts">
        <span class="prompt-chip">🧸 Sharing toys</span>
        <span class="prompt-chip">🔁 Taking turns</span>
        <span class="prompt-chip">🤝 Helping someone who was left out</span>
      </div>
      <div class="qbox" style="margin-top:16px;">
        <h4>While they draw</h4>
        Quietly repeat the quote so they hear it again: <em>"${QUOTE_TEXT}"</em>
      </div>
      <p>When they finish, let a few children hold up their drawing and tell the group what fair thing they drew.</p>
    `;
  } else if(stepId === 6){
    content = document.createElement('div');
    content.innerHTML = `
      <ul class="tidy">
        <li>Ask the children to say the quote back to you one last time, all together.</li>
        <li>Ask: "What is one fair thing you will do this week?"</li>
      </ul>
      <p>Close by saying the opening prayer together again:</p>
      <div class="prayer">"${PRAYER.text}"<span class="who">${PRAYER.who}</span></div>
      <div class="notes-grid" style="margin-top:20px;">
        <div>
          <label for="noteWorked">Notes for next time — What worked</label>
          <textarea class="note" id="noteWorked"></textarea>
        </div>
        <div>
          <label for="noteChange">What to change</label>
          <textarea class="note" id="noteChange"></textarea>
        </div>
        <div>
          <label for="noteSupport">Which children need a little more support</label>
          <textarea class="note" id="noteSupport"></textarea>
        </div>
      </div>
    `;
  }
  panel.appendChild(content);

  if(stepId === 6){
    ['noteWorked','noteChange','noteSupport'].forEach(key => {
      const el = panel.querySelector('#' + key);
      el.value = localStorage.getItem(key) || '';
      el.addEventListener('input', () => localStorage.setItem(key, el.value));
    });
  }

  const footer = document.createElement('div');
  footer.className = 'footer-nav';
  const prevBtn = document.createElement('button');
  prevBtn.className = 'btn secondary';
  prevBtn.textContent = '← Previous';
  prevBtn.disabled = stepId === 1;
  prevBtn.addEventListener('click', () => { current = stepId - 1; render(); });
  const nextBtn = document.createElement('button');
  nextBtn.className = 'btn';
  nextBtn.textContent = 'Next →';
  nextBtn.disabled = stepId === steps.length;
  nextBtn.addEventListener('click', () => { current = stepId + 1; render(); });
  footer.appendChild(prevBtn);
  footer.appendChild(nextBtn);
  panel.appendChild(footer);
}

function render(){
  renderNav();
  renderStep(current);
  updateKidScreen();
}

/* ---------- Kid screen ---------- */

const KID_STYLES = `

  .foot .label{ font-size:0.72rem; font-weight:700; color:#7C6E5A; text-align:center; max-width:70px; }

  .card{ max-width:1000px; width:100%; text-align:center; }
  .kid-title{ font-family:Georgia,"Iowan Old Style",serif; font-size:3rem; margin:0 0 20px; text-wrap:balance; }
  .kid-emoji-big{ font-size:5rem; margin-bottom:6px; }
  .kid-prayer{ font-family:Georgia,serif; font-style:italic; font-size:1.9rem; line-height:1.5; max-width:820px; margin:0 auto; color:#2B2118; }
  .kid-who{ margin-top:14px; font-size:1.2rem; color:#7C6E5A; }
  .kid-question{ font-size:2rem; font-weight:700; color:#204B4A; margin-top:10px; }

  .kid-board{ background:#26312F; border-radius:20px; padding:30px 20px; display:flex; flex-wrap:wrap; gap:14px; justify-content:center; }
  .kid-tile{ background:#334340; border-radius:12px; padding:14px 20px; font-family:Georgia,serif; font-style:italic; font-size:2rem; font-weight:700; color:#F2EFE6; min-width:64px; }
  .kid-tile.hidden{ background:#1c2523; color:#E8C468; font-style:normal; animation: pop .35s ease; }
  .kid-stars{ font-size:2rem; letter-spacing:6px; margin-bottom:18px; }
  .kid-attr{ margin-top:18px; font-style:italic; color:#F2EFE6; opacity:0.6; font-family:Georgia,serif; font-size:1.1rem; }
  .kid-celebrate{ margin-top:22px; font-size:2rem; font-weight:800; color:#B87F2B; animation: bounce 1s ease infinite; }

  .orange-side{ display:flex; flex-direction:column; align-items:center; gap:10px; }

  .orange-label{ font-size:1.1rem; font-weight:700; color:#7C6E5A; }

  .deal-row{ display:flex; gap:18px; justify-content:center; flex-wrap:wrap; margin-top:10px; }
  .kid-avatar{ display:flex; flex-direction:column; align-items:center; gap:8px; }
  .kid-avatar .face{ width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:1.3rem; }
  .pile{ min-height:32px; display:flex; flex-wrap:wrap; gap:4px; justify-content:center; max-width:100px; }
  .dot{ width:16px; height:16px; border-radius:50%; background:#B87F2B; }

function pathTrackerHTML(){
  return `<div class="path">${steps.map(s => `
    <div class="foot ${s.id === current ? 'active' : ''} ${s.id < current ? 'done' : ''}">
      <div class="circle">${s.emoji}</div>
      <div class="label">${s.kidLabel}</div>
    </div>
  `).join('')}</div>`;
}

function buildKidCardHTML(stepId){
  if(stepId === 1 || stepId === 6){
    const heading = stepId === 1 ? "Let's Begin!" : "Great Job Today! 🎉";
    return `
      <div class="card">
        <div class="kid-emoji-big">${stepId === 1 ? '🙏' : '🎉'}</div>
        <h1 class="kid-title">${heading}</h1>
        ${stepId === 6 ? '<p class="kid-question">What is one fair thing you will do this week?</p>' : ''}
        <p class="kid-prayer">"${PRAYER.text}"</p>
        <p class="kid-who">${PRAYER.who}</p>
      </div>
    `;
  }
  if(stepId === 2){
    const hiddenIdx = new Set(hideOrder.slice(0, hiddenCount));
    const tiles = quoteWords.map((w, i) => `<span class="kid-tile ${hiddenIdx.has(i) ? 'hidden' : ''}">${hiddenIdx.has(i) ? '❓' : w}</span>`).join('');
    const stars = '⭐'.repeat(hiddenCount) + '☆'.repeat(Math.max(0, quoteWords.length - hiddenCount));
    return `
      <div class="card">
        <h1 class="kid-title">The Magic Quote</h1>
        <div class="kid-stars">${stars}</div>
        <div class="kid-board"><div class="kid-tile-wrap" style="display:flex;flex-wrap:wrap;gap:14px;justify-content:center;">${tiles}</div></div>
        <div class="kid-attr">${QUOTE_WHO}</div>
        ${hiddenCount === quoteWords.length ? '<div class="kid-celebrate">🎉 You know it by heart! 🎉</div>' : ''}
      </div>
    `;
  }
  if(stepId === 3){
    if(!storyRevealed){
      return `
        <div class="card">
          <h1 class="kid-title">One Orange, Two Friends</h1>
          <div class="orange-scene">
            <div class="orange-side"><span>🍊</span><span class="orange-face">😀</span><span class="orange-label">has it all</span></div>
            <div class="orange-side"><span>—</span><span class="orange-face">😢</span><span class="orange-label">has none</span></div>
          </div>
          <p class="kid-question">Is that fair?</p>
        </div>
      `;
    }
    return `
      <div class="card">
        <h1 class="kid-title">Sharing Is Fair!</h1>
        <div class="orange-scene">
          <div class="orange-side"><span>🍊</span><span class="orange-face">😊</span><span class="orange-label">half each</span></div>
          <div class="orange-side"><span>🍊</span><span class="orange-face">😊</span><span class="orange-label">half each</span></div>
        </div>
        <p class="kid-question">That is walking the straight path!</p>
      </div>
    `;
  }
  if(stepId === 4){
    const avatars = deal.assigned.length ? deal.assigned : new Array(deal.children).fill(0);
    const lastChild = deal.dealt > 0 ? deal.order[deal.dealt - 1] : -1;
    const rows = avatars.map((count, i) => {
      const dots = Array.from({length: count}).map((_, di) => {
        const isNew = i === lastChild && di === count - 1;
        return `<span class="dot ${isNew ? 'pop' : ''}"></span>`;
      }).join('');
      return `
        <div class="kid-avatar">
          <div class="face" style="background:${AVATAR_COLORS[i % AVATAR_COLORS.length]}">${i+1}</div>
          <div class="pile">${dots}</div>
        </div>
      `;
    }).join('');
    const finished = deal.total > 0 && deal.dealt >= deal.total;
    let basket = '';
    if(finished){
      basket = deal.leftover === 0
        ? `<div class="basket">🎉 Perfectly fair — nothing left over!</div>`
        : `<div class="basket">🧺 ${deal.leftover} left in the basket — what should we do? 🤔</div>`;
    }
    return `
      <div class="card">
        <h1 class="kid-title">Fair Shares</h1>
        <div class="deal-row">${rows}</div>
        ${basket}
      </div>
    `;
  }
  if(stepId === 5){
    return `
      <div class="card">
        <h1 class="kid-title">Draw Something Fair!</h1>
        <div class="kid-cards">
          <div class="kid-card"><span class="icon">🧸</span><span class="label">Sharing toys</span></div>
          <div class="kid-card"><span class="icon">🔁</span><span class="label">Taking turns</span></div>
          <div class="kid-card"><span class="icon">🤝</span><span class="label">Helping a friend</span></div>
        </div>
        <div class="kid-timer" id="kidTimer">${fmt(stepTimers[5].remaining)}</div>
      </div>
    `;
  }
  return '';
}

function updateKidScreen(){
  if(!kidWin || kidWin.closed){ setKidStatus(false); return; }
  setKidStatus(true);
  const root = kidWin.document.getElementById('kidRoot');
  if(!root) return;
  root.innerHTML = pathTrackerHTML() + `<main>${buildKidCardHTML(current)}</main>`;
}

function updateKidTimerOnly(){
  if(!kidWin || kidWin.closed || current !== 5) return;
  const el = kidWin.document.getElementById('kidTimer');
  if(el) el.textContent = fmt(stepTimers[5].remaining);
}

function setKidStatus(open){
  const el = document.getElementById('kidStatus');
  const btn = document.getElementById('kidScreenBtn');
  if(open){
    el.textContent = 'Open — drag this window to the class screen or TV';
    el.className = 'kid-status open';
    btn.textContent = '🖥️ Kid Screen Open';
  } else {
    el.textContent = 'Not open — click to show it on the class screen';
    el.className = 'kid-status';
    btn.textContent = '🖥️ Open Kid Screen';
  }
}

function openKidScreen(){
  if(kidWin && !kidWin.closed){
    kidWin.focus();
    return;
  }
  kidWin = window.open('', 'justiceKidScreen', 'width=1200,height=800');
  if(!kidWin){
    const el = document.getElementById('kidStatus');
    el.textContent = 'Pop-ups blocked — allow pop-ups for this page to open the kid screen.';
    el.className = 'kid-status blocked';
    return;
  }
  kidWin.document.open();
  kidWin.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Justice — Kid Screen</title><style>${KID_STYLES}</style></head><body><div class="stage" id="kidRoot"></div></body></html>`);
  kidWin.document.close();
  kidWin.addEventListener('beforeunload', () => { kidWin = null; setKidStatus(false); });
  updateKidScreen();
}

document.getElementById('kidScreenBtn').addEventListener('click', openKidScreen);

renderPrep();
updateMasterClock();
render();
</script>
